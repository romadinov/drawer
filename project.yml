name: Drawer
options:
  bundleIdPrefix: com.romadinov
  deploymentTarget:
    macOS: "27.0"
packages:
  DrawerCore:
    path: Core
targets:
  Drawer:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: DrawerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.drawer
        PRODUCT_NAME: Drawer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
